[project]
name = "kb-runtime"
version = "0.1.0"
description = "Composition root: assembles the agent runtime over deterministic services"
requires-python = ">=3.12,<3.13"
# The only package allowed to depend on both the agent runtime and the database. Nothing
# depends on kb-runtime in turn, so this is a leaf: the dependency arrows all point inward.
dependencies = ["kb-contracts", "kb-core", "kb-providers", "kb-agents"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_runtime"]
