[project]
name = "ken-backlink-os"
version = "0.1.0"
description = "Ken Research Agentic AI Backlink Outreach System (workspace root)"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = ["contracts/python", "services/core", "services/providers", "agents", "apps/api"]

[tool.uv.sources]
kb-contracts = { workspace = true }
kb-core = { workspace = true }
kb-providers = { workspace = true }
kb-agents = { workspace = true }
kb-api = { workspace = true }

[dependency-groups]
dev = [
  "kb-contracts", "kb-core", "kb-providers", "kb-agents", "kb-api",
  "pytest>=8.3", "pytest-asyncio>=0.24", "hypothesis>=6.112", "ruff>=0.7",
  "mypy>=1.13", "import-linter>=2.1", "httpx>=0.27", "psycopg[binary]>=3.2",
  "alembic>=1.13", "sqlalchemy>=2.0", "pyyaml>=6", "types-pyyaml",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["contracts/generated_ts", "node_modules"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["E501", "SIM905"]  # generated SQL strings / table list
"tests/**" = ["E501"]
"infrastructure/scripts/*.tmpl" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "contracts/python/src:services/core/src:services/providers/src:agents/src:apps/api/src"
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["req(id): requirement ID from docs/01 for traceability", "db: needs the dev PostgreSQL"]
addopts = "-ra --strict-markers"

[tool.importlinter]
root_packages = ["kb_contracts", "kb_core", "kb_providers", "kb_agents", "kb_api"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "kb_contracts imports no other kb package"
type = "forbidden"
source_modules = ["kb_contracts"]
forbidden_modules = ["kb_core", "kb_providers", "kb_agents", "kb_api"]

[[tool.importlinter.contracts]]
name = "agents act only through ToolGateway (no db/email/crawler/browser)"
type = "forbidden"
source_modules = ["kb_agents"]
forbidden_modules = [
  "kb_core.db", "kb_providers.email", "kb_providers.crawler", "kb_providers.browser",
]

[[tool.importlinter.contracts]]
name = "api does not import agent internals"
type = "forbidden"
source_modules = ["kb_api"]
forbidden_modules = ["kb_agents"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true  # asyncpg ships no stubs
