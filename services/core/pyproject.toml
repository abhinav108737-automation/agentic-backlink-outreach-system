[project]
name = "kb-core"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# kb-providers is used by kb_core.db.vector_rebuild (the Qdrant rebuild CLI). kb-agents is
# deliberately absent: core must not depend on the agent layer above it, which import-linter
# now enforces. The agent wiring lives in kb-runtime.
dependencies = ["kb-contracts", "kb-providers", "sqlalchemy>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_core"]
